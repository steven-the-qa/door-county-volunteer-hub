<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Door County Volunteer Hub — Content Admin</title>
  <style>
    /* Scoped entirely to our own injected elements — Decap's own UI is
       never targeted or touched by anything in this file. */

    /* Full-screen cover shown on load, removed for good on click. Decap
       mounts normally underneath the whole time; this just sits on top of
       it, so there's nothing here that depends on Decap's own markup. */
    #dcvh-gate {
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: #fbfaf7;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #dcvh-gate-title {
      font: bold 28px Verdana, Geneva, Arial, sans-serif;
      color: #2e5339;
      margin-bottom: 4px;
    }
    #dcvh-gate-sub {
      font: 14px Verdana, Geneva, Arial, sans-serif;
      color: #555;
      margin-bottom: 22px;
    }
    #dcvh-gate-body {
      max-width: 360px;
      margin: 0 auto 26px;
      font: 14px/1.5 Verdana, Geneva, Arial, sans-serif;
      color: #333;
    }
    #dcvh-gate-continue {
      background: #2e5339;
      color: #fff;
      border: none;
      border-radius: 4px;
      font: bold 15px Verdana, Geneva, Arial, sans-serif;
      padding: 11px 22px;
      cursor: pointer;
    }
    #dcvh-gate-continue:hover { background: #24422d; }
    #dcvh-gate-back {
      display: block;
      margin-top: 18px;
      font: 13px Verdana, Geneva, Arial, sans-serif;
      color: #2e5339;
    }

    #dcvh-help-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: #2e5339;
      color: #fff;
      font: bold 18px/40px Verdana, Geneva, Arial, sans-serif;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }
    #dcvh-help-btn:hover { background: #24422d; }

    #dcvh-help {
      border: 2px solid #2e5339;
      padding: 0;
      max-width: 640px;
      width: 90%;
      max-height: 80vh;
    }
    #dcvh-help::backdrop { background: rgba(0, 0, 0, 0.5); }
    #dcvh-help-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #2e5339;
      color: #fff;
      font: bold 16px Verdana, Geneva, Arial, sans-serif;
    }
    #dcvh-help-close {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    #dcvh-help-intro {
      padding: 14px 22px 0;
      font: 13px/1.5 Verdana, Geneva, Arial, sans-serif;
      color: #555;
    }
    #dcvh-help-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 14px 22px 0;
      border-bottom: 1px solid #ccc;
    }
    .dcvh-tab-btn {
      font: 13px Verdana, Geneva, Arial, sans-serif;
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      background: #eee;
      color: #333;
      cursor: pointer;
      position: relative;
      top: 1px;
    }
    .dcvh-tab-btn[aria-selected="true"] {
      background: #fff;
      border-color: #2e5339;
      border-bottom: 1px solid #fff;
      color: #2e5339;
      font-weight: bold;
    }
    #dcvh-help-panels {
      padding: 16px 22px 20px;
      overflow-y: auto;
      max-height: calc(80vh - 52px - 60px);
      font: 14px/1.6 Verdana, Geneva, Arial, sans-serif;
      color: #222;
    }
    .dcvh-subtabs {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
    }
    .dcvh-subtab-btn {
      font: 12px Verdana, Geneva, Arial, sans-serif;
      padding: 5px 12px;
      border: 1px solid #999;
      border-radius: 999px;
      background: #f5f5f5;
      color: #333;
      cursor: pointer;
    }
    .dcvh-subtab-btn[aria-selected="true"] {
      background: #2e5339;
      border-color: #2e5339;
      color: #fff;
    }
    #dcvh-help-panels h1 { font-size: 19px; margin: 0 0 10px; }
    #dcvh-help-panels h2 { font-size: 16px; margin: 22px 0 8px; }
    #dcvh-help-panels h3 { font-size: 14px; margin: 16px 0 6px; }
    #dcvh-help-panels p { margin: 0 0 12px; }
    #dcvh-help-panels ul, #dcvh-help-panels ol { margin: 0 0 12px; padding-left: 22px; }
    #dcvh-help-panels li { margin: 4px 0; }
    #dcvh-help-panels code {
      background: #eee;
      padding: 1px 5px;
      font-size: 13px;
      border-radius: 3px;
    }
    #dcvh-help-panels a { color: #2e5339; }
    #dcvh-help-intro code {
      background: #eee;
      padding: 1px 5px;
      font-size: 12px;
      border-radius: 3px;
    }

    #dcvh-save-confirm {
      border: 2px solid #2e5339;
      padding: 0;
      max-width: 420px;
      width: 90%;
    }
    #dcvh-save-confirm::backdrop { background: rgba(0, 0, 0, 0.5); }
    #dcvh-save-confirm-head {
      padding: 14px 18px;
      background: #2e5339;
      color: #fff;
      font: bold 16px Verdana, Geneva, Arial, sans-serif;
    }
    #dcvh-save-confirm-body {
      padding: 18px;
      font: 14px/1.5 Verdana, Geneva, Arial, sans-serif;
      color: #222;
    }
    #dcvh-save-confirm-body p { margin: 0 0 12px; }
    #dcvh-save-confirm-body p:last-child { margin-bottom: 0; }
    #dcvh-save-confirm-body code {
      background: #eee;
      padding: 1px 5px;
      font-size: 13px;
      border-radius: 3px;
    }
    #dcvh-save-confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 0 18px 18px;
    }
    #dcvh-save-confirm-cancel {
      background: none;
      border: none;
      color: #2e5339;
      text-decoration: underline;
      font: 14px Verdana, Geneva, Arial, sans-serif;
      cursor: pointer;
      padding: 8px 4px;
    }
    #dcvh-save-confirm-ok {
      background: #2e5339;
      color: #fff;
      border: none;
      border-radius: 4px;
      font: bold 14px Verdana, Geneva, Arial, sans-serif;
      padding: 9px 16px;
      cursor: pointer;
    }
    #dcvh-save-confirm-ok:hover { background: #24422d; }
  </style>
</head>
<body>
  <script>
  // Decap normally auto-initializes (fetches config.yml, mounts) the instant
  // its own script tag finishes loading. Registering a custom widget has to
  // happen BEFORE that mount, or Decap won't know the "orgid" widget type
  // exists yet when it builds the Organization ID field. Manual init defers
  // mounting until we explicitly call CMS.init() below, after registering.
  window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  // Custom widget: Organization ID as a text input with autocomplete
  // suggestions instead of a bare free-text field. Decap's documented
  // widget Control API only receives this field's own value/config — no
  // "entry" prop, no way to read the live Organizations list as you edit
  // it (checked directly against Decap's docs before building this any
  // other way). So this can't validate against or read the sibling list
  // live; what it CAN do is suggest known orgs via a native <datalist>,
  // which meaningfully cuts typo risk on existing orgs (pick instead of
  // recall-and-type) while still allowing a brand-new org's slug to be
  // typed freely in the same session. The CI check on the pull request
  // remains the actual safety net either way, same as before this existed.
  //
  // The suggestion list is field.options in config.yml -- the exact same
  // mechanism the built-in Categories select already uses, kept in sync by
  // hand when a new org is permanently added, same maintenance shape as
  // that existing gotcha, not a new kind of chore.
  (function () {
    var OrgIdControl = createClass({
      render: function () {
        var field = this.props.field;
        var raw = field && field.get ? field.get("options") : null;
        var options = Array.isArray(raw) ? raw : (raw && typeof raw.toJS === "function" ? raw.toJS() : []);
        var listId = this.props.forID + "-list";

        return h("span", {}, [
          h("input", {
            key: "input",
            id: this.props.forID,
            className: this.props.classNameWrapper,
            type: "text",
            list: listId,
            autoComplete: "off",
            value: this.props.value || "",
            onChange: (e) => this.props.onChange(e.target.value),
          }),
          h(
            "datalist",
            { key: "datalist", id: listId },
            options.map(function (opt) {
              return h("option", { key: String(opt), value: String(opt) });
            })
          ),
        ]);
      },
    });

    CMS.registerWidget("orgid", OrgIdControl);
    CMS.init();
  })();
  </script>
  <script>
  // Everything below is added via script, and only after decap-cms.js above
  // has already run — Decap takes over <body> on mount, so anything
  // declared statically in <body> gets wiped before it ever renders.

  // --- OAuth relay iframe ------------------------------------------------
  // Relays the OAuth login result from the popup to Decap CMS. Decap only
  // accepts that message from a window whose origin is exactly the auth
  // backend's base_url — a hidden iframe on that origin satisfies this
  // without ever depending on window.opener (which GitHub's OAuth page
  // breaks). See cms-auth/src/index.js for the full explanation.
  (function () {
    var relay = document.createElement("iframe");
    relay.src = "https://dcvh-cms-auth.docovolunteerhub.workers.dev/relay.html";
    relay.style.display = "none";
    relay.setAttribute("aria-hidden", "true");
    document.body.appendChild(relay);
  })();

  // --- "Admin Panel" gate screen -------------------------------------------
  // A full-screen cover, entirely our own markup, shown the instant this
  // script runs and removed for good on click. Decap mounts normally the
  // whole time underneath it — this never reads or reacts to anything of
  // Decap's, so unlike the old approach it has zero dependency on Decap's
  // internal class names. Appended as a sibling of Decap's own root (never
  // a child of it) so React has no reason to touch it, same reasoning as
  // the relay iframe above.
  (function () {
    var gate = document.createElement("div");
    gate.id = "dcvh-gate";
    gate.innerHTML =
      '<div>' +
        '<div id="dcvh-gate-title">Admin Panel</div>' +
        '<div id="dcvh-gate-sub">Door County Volunteer Hub</div>' +
        '<div id="dcvh-gate-body">' +
          "You'll log in with your GitHub account. Only people added as " +
          'collaborators on the repo can get in.' +
        '</div>' +
        '<button type="button" id="dcvh-gate-continue">Continue to login</button>' +
        '<a id="dcvh-gate-back" href="https://docovolunteerhub.com">← Back to the site</a>' +
      '</div>';
    document.body.appendChild(gate);

    document.getElementById("dcvh-gate-continue").addEventListener("click", function () {
      gate.remove();
    });
  })();

  // --- Help button + modal ------------------------------------------------
  (function () {
    var btn = document.createElement("button");
    btn.id = "dcvh-help-btn";
    btn.type = "button";
    btn.title = "How to use this CMS";
    btn.setAttribute("aria-label", "How to use this CMS");
    btn.textContent = "?";

    var dialog = document.createElement("dialog");
    dialog.id = "dcvh-help";
    dialog.innerHTML =
      '<div id="dcvh-help-head">' +
        '<span>How to use this CMS</span>' +
        '<button type="button" id="dcvh-help-close" aria-label="Close">×</button>' +
      '</div>' +
      '<div id="dcvh-help-intro"></div>' +
      '<div id="dcvh-help-tabs" role="tablist" aria-label="Help topics"></div>' +
      '<div id="dcvh-help-panels">Loading…</div>';

    document.body.appendChild(dialog);
    document.body.appendChild(btn);

    var introEl = dialog.querySelector("#dcvh-help-intro");
    var tabsEl = dialog.querySelector("#dcvh-help-tabs");
    var panelsEl = dialog.querySelector("#dcvh-help-panels");
    var loaded = false;

    function loadHelp() {
      if (loaded) return;
      loaded = true;
      fetch("help.md", { cache: "no-cache" })
        .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
        .then(function (md) { buildTabs(parseDoc(md)); })
        .catch(function () {
          tabsEl.innerHTML = "";
          panelsEl.textContent = "Couldn't load the help doc. It also lives at admin/help.md in the repo.";
        });
    }

    btn.addEventListener("click", function () {
      loadHelp();
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    });
    dialog.querySelector("#dcvh-help-close").addEventListener("click", function () {
      if (typeof dialog.close === "function") dialog.close();
      else dialog.removeAttribute("open");
    });
    dialog.addEventListener("click", function (e) {
      if (e.target === dialog) dialog.close(); // backdrop click
    });

    // Splits help.md into { introMd, tabs: [{ label, md, subtabs: [{label, md}] }] }
    // by heading level: the H1's own body text becomes the always-visible
    // intro, each H2 becomes a tab, and any H3s inside a tab become subtabs.
    // Kept this simple on purpose — help.md is written to fit exactly this
    // shape (at most one level of subtabs), not general CommonMark nesting.
    function parseDoc(md) {
      var lines = md.replace(/\r\n/g, "\n").split("\n");
      var i = 0;
      if (/^# /.test(lines[0] || "")) i = 1;

      var introLines = [];
      while (i < lines.length && !/^## /.test(lines[i])) { introLines.push(lines[i]); i++; }

      var tabs = [];
      while (i < lines.length) {
        var tabLabel = lines[i].replace(/^## /, "").trim();
        i++;
        var bodyLines = [];
        var subtabs = [];
        while (i < lines.length && !/^## /.test(lines[i])) {
          if (/^### /.test(lines[i])) {
            var subLabel = lines[i].replace(/^### /, "").trim();
            i++;
            var subLines = [];
            while (i < lines.length && !/^## /.test(lines[i]) && !/^### /.test(lines[i])) {
              subLines.push(lines[i]);
              i++;
            }
            subtabs.push({ label: subLabel, md: subLines.join("\n") });
          } else {
            bodyLines.push(lines[i]);
            i++;
          }
        }
        tabs.push({ label: tabLabel, md: bodyLines.join("\n"), subtabs: subtabs });
      }
      return { introMd: introLines.join("\n"), tabs: tabs };
    }

    function buildTabs(doc) {
      introEl.innerHTML = renderMarkdown(doc.introMd);

      tabsEl.innerHTML = "";
      panelsEl.innerHTML = "";

      doc.tabs.forEach(function (tab, index) {
        var tabBtn = document.createElement("button");
        tabBtn.type = "button";
        tabBtn.className = "dcvh-tab-btn";
        tabBtn.setAttribute("role", "tab");
        tabBtn.textContent = tab.label;

        var panel = document.createElement("div");
        panel.setAttribute("role", "tabpanel");
        panel.hidden = index !== 0;

        if (tab.subtabs.length) {
          var subtabsBar = document.createElement("div");
          subtabsBar.className = "dcvh-subtabs";
          subtabsBar.setAttribute("role", "tablist");

          var subPanels = [];
          tab.subtabs.forEach(function (sub, subIndex) {
            var subBtn = document.createElement("button");
            subBtn.type = "button";
            subBtn.className = "dcvh-subtab-btn";
            subBtn.setAttribute("role", "tab");
            subBtn.textContent = sub.label;

            var subPanel = document.createElement("div");
            subPanel.hidden = subIndex !== 0;
            subPanel.innerHTML = renderMarkdown(sub.md);
            subPanels.push(subPanel);

            subBtn.setAttribute("aria-selected", subIndex === 0 ? "true" : "false");
            subBtn.addEventListener("click", function () {
              subtabsBar.querySelectorAll(".dcvh-subtab-btn").forEach(function (b) { b.setAttribute("aria-selected", "false"); });
              subPanels.forEach(function (p) { p.hidden = true; });
              subBtn.setAttribute("aria-selected", "true");
              subPanel.hidden = false;
              panelsEl.scrollTop = 0;
            });

            subtabsBar.appendChild(subBtn);
          });

          panel.appendChild(subtabsBar);
          subPanels.forEach(function (p) { panel.appendChild(p); });
        } else {
          panel.innerHTML = renderMarkdown(tab.md);
        }

        tabBtn.setAttribute("aria-selected", index === 0 ? "true" : "false");
        tabBtn.addEventListener("click", function () {
          tabsEl.querySelectorAll(".dcvh-tab-btn").forEach(function (b) { b.setAttribute("aria-selected", "false"); });
          panelsEl.querySelectorAll('[role="tabpanel"]').forEach(function (p) { p.hidden = true; });
          tabBtn.setAttribute("aria-selected", "true");
          panel.hidden = false;
          panelsEl.scrollTop = 0;
        });

        tabsEl.appendChild(tabBtn);
        panelsEl.appendChild(panel);
      });
    }

    // Small markdown -> HTML converter covering just what help.md uses:
    // #/##/### headings, blank-line paragraphs, "- " and "1. " lists,
    // **bold**, `code`, and [text](url) links. Not a general CommonMark
    // implementation on purpose — the source content is ours and stays
    // within this subset.
    function renderMarkdown(md) {
      var lines = md.replace(/\r\n/g, "\n").split("\n");
      var html = "";
      var i = 0;

      function esc(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function inline(s) {
        s = esc(s);
        s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
        s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        return s;
      }

      // Renders a - or 1. list starting at the current line. Any indented
      // line that follows an item but isn't itself a new item is treated as
      // a wrapped continuation of that item's text (appended, never
      // dropped) rather than a true nested list — help.md is written to
      // avoid real nesting so this never loses content.
      function renderList(itemRe) {
        var items = [];
        while (i < lines.length && lines[i].trim() !== "" && (itemRe.test(lines[i]) || /^\s+\S/.test(lines[i]))) {
          if (itemRe.test(lines[i])) {
            items.push(lines[i].replace(itemRe, ""));
          } else if (items.length) {
            items[items.length - 1] += " " + lines[i].trim();
          }
          i++;
        }
        return items;
      }

      while (i < lines.length) {
        var line = lines[i];
        if (/^### /.test(line)) { html += "<h3>" + inline(line.slice(4)) + "</h3>"; i++; continue; }
        if (/^## /.test(line)) { html += "<h2>" + inline(line.slice(3)) + "</h2>"; i++; continue; }
        if (/^# /.test(line)) { html += "<h1>" + inline(line.slice(2)) + "</h1>"; i++; continue; }

        if (/^-\s+/.test(line)) {
          var ulItems = renderList(/^-\s+/);
          html += "<ul>" + ulItems.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ul>";
          continue;
        }
        if (/^\d+\.\s+/.test(line)) {
          var olItems = renderList(/^\d+\.\s+/);
          html += "<ol>" + olItems.map(function (t) { return "<li>" + inline(t) + "</li>"; }).join("") + "</ol>";
          continue;
        }
        if (line.trim() === "") { i++; continue; }

        var para = [line];
        i++;
        while (i < lines.length && lines[i].trim() !== "" && !/^(#{1,3}\s|-\s|\d+\.\s)/.test(lines[i])) {
          para.push(lines[i]);
          i++;
        }
        html += "<p>" + inline(para.join(" ")) + "</p>";
      }
      return html;
    }
  })();

  // --- Confirm before Save actually happens -------------------------------
  // Decap's Save button creates/updates a pull request with zero explanation
  // of that in the moment — checked directly against its bundled source:
  // there's no confirmation dialog anywhere in its Save path (only its
  // separate, later Publish/merge step has one, and even that never
  // mentions "pull request"). There's also a documented preSave event
  // (CMS.registerEventListener), but its return value is only ever used to
  // rewrite the entry's data before saving — persistEntry calls it and then
  // unconditionally continues to the real save regardless of what it
  // returns, so it can't cancel anything. Intercepting the actual button
  // click is the only way to make Save genuinely cancelable.
  //
  // Mechanism: a capture-phase listener on document always runs before
  // Decap's own click handler (which React attaches in the bubble phase on
  // its root container), so stopImmediatePropagation() here reliably blocks
  // the real save until this confirms. Checked too: no keyboard shortcut
  // triggers Save in this Decap version, so a click-only intercept doesn't
  // leave a bypass route.
  (function () {
    var dialog = document.createElement("dialog");
    dialog.id = "dcvh-save-confirm";
    dialog.innerHTML =
      '<div id="dcvh-save-confirm-head">Before you save</div>' +
      '<div id="dcvh-save-confirm-body">' +
        '<p>Save doesn’t publish anything. It opens a GitHub pull request. Nothing hits the live site until that’s reviewed and merged.</p>' +
        '<p>If you haven’t confirmed this with the org yet, leave <strong>Status</strong> at <code>draft</code> and <strong>Verified</strong> off.</p>' +
      '</div>' +
      '<div id="dcvh-save-confirm-actions">' +
        '<button type="button" id="dcvh-save-confirm-cancel">Cancel</button>' +
        '<button type="button" id="dcvh-save-confirm-ok">Save — opens a pull request</button>' +
      '</div>';
    document.body.appendChild(dialog);

    var cancelBtn = dialog.querySelector("#dcvh-save-confirm-cancel");
    var okBtn = dialog.querySelector("#dcvh-save-confirm-ok");
    var pendingButton = null;
    var bypassNext = false;

    function openDialog() {
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    }
    function closeDialog() {
      if (typeof dialog.close === "function") dialog.close();
      else dialog.removeAttribute("open");
      pendingButton = null;
    }

    cancelBtn.addEventListener("click", closeDialog);
    dialog.addEventListener("click", function (e) {
      if (e.target === dialog) closeDialog(); // backdrop click
    });
    okBtn.addEventListener("click", function () {
      var btn = pendingButton;
      closeDialog();
      if (btn) {
        bypassNext = true;
        btn.click(); // re-dispatch; the capture listener below lets this one through
      }
    });

    document.addEventListener(
      "click",
      function (e) {
        if (bypassNext) { bypassNext = false; return; }
        var btn = e.target.closest ? e.target.closest("button") : null;
        if (!btn || btn.textContent.trim() !== "Save") return;
        e.preventDefault();
        e.stopImmediatePropagation();
        pendingButton = btn;
        openDialog();
      },
      true // capture phase — must run before Decap's own bubble-phase handler
    );
  })();
  </script>
</body>
</html>
