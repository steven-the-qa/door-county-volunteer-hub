<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Door County Volunteer Hub — Content Admin</title>
</head>
<body>
  <!--
    Relays the OAuth login result from the popup to Decap CMS. Decap only
    accepts that message from a window whose origin is exactly the
    auth backend's base_url — a hidden iframe on that origin satisfies this
    without ever depending on window.opener (which GitHub's OAuth page
    breaks). See cms-auth/src/index.js for the full explanation.
  -->
  <iframe src="https://dcvh-cms-auth.docovolunteerhub.workers.dev/relay.html"
          style="display:none" title="" aria-hidden="true"></iframe>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
